name: upstream-watch

# This image ships Ubuntu's CUPS packages, never upstream source, so an OpenPrinting release changes
# nothing here by itself. The fix reaches users when Ubuntu publishes a package carrying it, and
# build.yml's package fingerprint then rebuilds, smoke-tests and publishes on its own the same day.
#
# What CAN slip is human attention: upstream 2.4.20 (2026-10-05) shipped security fixes that Ubuntu's
# 2.4.16-1ubuntu1.3 did not have yet. So this opens ONE issue per upstream release, with a checklist,
# and does nothing else - it never builds, and never touches the image.

on:
  schedule:
    # Mondays, off the hour (scheduled runs at :00 are the ones GitHub delays or drops under load).
    - cron: '41 7 * * 1'
  workflow_dispatch:

# Opening an issue is all this does. Reading OpenPrinting's public release feed needs no scope.
permissions:
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue for a new upstream CUPS release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # /releases/latest is the newest release that is neither a draft nor a prerelease, so
          # betas and 2.5/3.0 previews never open an issue.
          TAG=$(gh api repos/OpenPrinting/cups/releases/latest --jq .tag_name)
          # Another project's text, about to land in an issue title and in URLs: whitelist it.
          if [[ ! "$TAG" =~ ^v?[0-9]+(\.[0-9]+){1,3}([a-z0-9.-]{0,20})$ ]]; then
            echo "::error::unexpected OpenPrinting/cups release tag '${TAG}' - refusing to use it"
            exit 1
          fi
          TITLE="Upstream CUPS ${TAG} released"

          # Every state, not just open: once the checklist is worked through and the issue closed,
          # the same release must not be re-reported every Monday. Listed and matched exactly rather
          # than through the search API, whose index lags and whose matching is fuzzy.
          ISSUES=$(gh issue list --state all --limit 500 --json number,title)
          EXISTING=$(jq -r --arg t "$TITLE" '[.[] | select(.title == $t) | .number] | first // empty' <<< "$ISSUES")
          if [ -n "$EXISTING" ]; then
            echo "::notice::#${EXISTING} already tracks ${TAG} - nothing to do"
            exit 0
          fi

          # What is published now, best effort and anonymous (exactly what any user sees). The
          # version annotation is the Ubuntu package version, e.g. 2.4.16-1ubuntu1.3.
          REPO_PATH="$(tr '[:upper:]' '[:lower:]' <<< "${GITHUB_REPOSITORY_OWNER}")/cups"
          PUBLISHED=""
          if TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:${REPO_PATH}:pull&service=ghcr.io" | jq -r .token); then
            PUBLISHED=$(curl -fsSL -H "Authorization: Bearer ${TOKEN}" \
                          -H 'Accept: application/vnd.oci.image.index.v1+json' \
                          "https://ghcr.io/v2/${REPO_PATH}/manifests/latest" \
                        | jq -r '.annotations["org.opencontainers.image.version"] // empty') || PUBLISHED=""
          fi
          [[ "$PUBLISHED" =~ ^[0-9][A-Za-z0-9.+~:-]{0,99}$ ]] || PUBLISHED=""

          # Already shipping that upstream release (or newer)? Then there is nothing to wait for.
          # Only the upstream part is compared: Ubuntu backports security fixes as revisions of an
          # OLDER upstream version, which is exactly the case the checklist is for.
          if [ -n "$PUBLISHED" ]; then
            SHIPPED="${PUBLISHED#*:}"
            SHIPPED="${SHIPPED%-*}"
            if dpkg --compare-versions "$SHIPPED" ge "${TAG#v}"; then
              echo "::notice::already shipping upstream ${SHIPPED} (package ${PUBLISHED}), which is not older than ${TAG}"
              exit 0
            fi
          fi

          BODY="${RUNNER_TEMP}/body.md"
          cat > "$BODY" <<EOF
          OpenPrinting published **CUPS ${TAG}**: https://github.com/OpenPrinting/cups/releases/tag/${TAG}

          This image ships Ubuntu's \`cups\` packages (currently published: \`${PUBLISHED:-unknown}\`), not upstream source. Nothing needs rebuilding by hand: when Ubuntu publishes a package carrying these changes, the daily \`build\` workflow's package fingerprint changes, and it rebuilds, smoke-tests and publishes on its own. This issue exists so the release gets looked at.

          - [ ] Read the release notes; list any security fixes (CVE / GHSA ids) here
          - [ ] Check whether Ubuntu has shipped them for resolute (26.04): https://launchpad.net/ubuntu/+source/cups and https://ubuntu.com/security/cves?package=cups
          - [ ] If a security fix is not in Ubuntu yet: decide whether the README should say so (the image is LAN-only by design; /admin needs credentials and TLS)
          - [ ] Once Ubuntu ships it: confirm the \`build\` workflow published a new image (the \`cups-daemon=\` line of \`/package_versions.txt\`, or the new \`:<version>-ls<N>\` tag)
          - [ ] Close this issue

          _Opened by the upstream-watch workflow._
          EOF
          # (YAML strips the block's indentation before bash sees it, so the heredoc and its EOF
          # terminator are at column 0 in the script that actually runs.)

          URL=$(gh issue create --title "$TITLE" --body-file "$BODY")
          echo "::notice::opened ${URL}"
